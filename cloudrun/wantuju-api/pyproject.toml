[project]
name = "wantuju-api"
version = "0.1.0"
description = "CloudBase Run FastAPI service for Wantuju miniapp development and trial builds"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "pillow>=12.2.0",
    "psycopg[binary,pool]>=3.2",
    "python-fasthtml>=0.13.4",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
