</button>

<section class="flex flex-col items-center text-center mt-md">
<h2 class="font-h1 text-h1 text-on-surface mb-sm">趣味看手相解读</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">探索你的天赋、性格与运势</p>

<div class="flex flex-wrap justify-center gap-sm mt-md">

<span class="material-symbols-outlined text-[16px] text-primary">psychology</span>
<span class="font-label-sm text-label-sm text-primary">趣味解读</span>
</div>
<div class="px-sm py-[2px] bg-primary/10 border border-primary/20 rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">analytics</span>
<span class="font-label-sm text-label-sm text-primary">专业分析</span>
</div>
<div class="px-sm py-[2px] bg-primary/10 border border-primary/20 rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">image</span>
<span class="font-label-sm text-label-sm text-primary">精美海报</span>
</div>
</div>
</section>

</div>
<div class="grid grid-cols-2 gap-md">

</div>

<!-- Line 1 -->
<div class="bg-surface-container p-sm rounded-lg border border-outline-variant/30 flex items-start gap-xs">

</div>
</div>

<div class="bg-surface-container p-sm rounded-lg border border-outline-variant/30 flex items-start gap-xs">

<div>
<p class="font-label-sm text-label-sm text-on-surface font-bold">感情线</p>
<p class="font-label-sm text-label-sm text-on-surface-variant line-clamp-2">情感丰富，注重精神交流，内心细腻。</p>
</div>
</div>
<!-- Line 3 -->
<div class="bg-surface-container p-sm rounded-lg border border-outline-variant/30 flex items-start gap-xs">
