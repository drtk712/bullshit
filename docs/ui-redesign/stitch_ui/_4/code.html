<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pt-safe pb-safe selection:bg-primary-container/30">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-page h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-[20px] docked full-width top-0 z-50 shadow-[0px_4px_20px_rgba(23,33,27,0.04)] active:scale-95 transition-transform duration-200">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high/50 dark:hover:bg-surface-container-highest/50 transition-colors text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">grid_view</span>
</button>
<h1 class="font-h1 text-h1 tracking-tight text-on-surface dark:text-on-surface-variant">玩图局</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high/50 dark:hover:bg-surface-container-highest/50 transition-colors text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center px-margin-page pt-lg pb-xl max-w-lg mx-auto w-full">
<!-- Header Text -->
<div class="text-center mb-xl w-full">
<h2 class="font-h1 text-h1 text-on-background mb-xs">生成中...</h2>
<p class="font-body-md text-body-md text-on-surface-variant">正在努力创作你的专属作品</p>
</div>
<!-- Illustration Area (Using provided image placeholder) -->
<div class="w-full aspect-square max-w-[280px] rounded-full overflow-hidden mb-xl shadow-[0px_4px_30px_rgba(21,199,122,0.15)] bg-surface-container-low flex items-center justify-center relative p-md">
<!-- Circular Progress Ring (Decorative) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-primary-container" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301.59" stroke-dashoffset="105.55" stroke-width="4"></circle> <!-- roughly 65% of 2*pi*r -->
</svg>
<div class="w-full h-full rounded-full overflow-hidden border-4 border-surface bg-surface-container-highest relative">
<img alt="Playful 3D illustration of a magic paintbrush creating magical sparkles in a light modern setting." class="w-full h-full object-cover object-center" data-alt="A playful, high-quality 3D rendered illustration of a stylized magic paintbrush floating in mid-air, drawing glowing, vibrant green sparkles and abstract shapes. The scene is set in a very clean, bright, light-mode environment with soft ambient lighting and subtle pastel shadows. The overall aesthetic perfectly matches a modern, youthful Gen-Z app design with a lightweight, joyful vibe." src="https://lh3.googleusercontent.com/aida/ADBb0uhSfR7Sy6yhtfMC0frrKdbeU4v3KtRBX7Qsd6dC6j-YekcQ_5WQyoCSajqLaGxNRye2gw7tVeGymQ2fuuTTbU1j8XsijDzZluPgPMIFwoJOyy1UKPRZqItd4_oplN2l280MCGNugrZcWyBxTWV0MU_41fEVgl5qvyr0nVgRn4ZqePO2e8tM7liLZuyqMmBw61vEkVXYU-spWpXaQcLyIXSqmWBeW0yox8m2yw28Mosk1URhrsd8dMG5hLSgk9l6UTKVj5eF0pL0RhU"/>
</div>
</div>
<!-- Progress Card (Bento Style) -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-lg shadow-[0px_4px_20px_rgba(23,33,27,0.04)] mb-lg relative overflow-hidden">
<!-- Progress Background fill (Subtle) -->
<div class="absolute top-0 left-0 h-full bg-primary-container/5" style="width: 65%;"></div>
<div class="relative z-10 flex flex-col gap-md">
<!-- Card Header -->
<div class="flex justify-between items-end mb-sm">
<h3 class="font-h3 text-h3 text-on-background">正在分析手掌特征</h3>
<span class="font-h2 text-h2 text-primary-container">65%</span>
</div>
<!-- Main Progress Bar -->
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full" style="width: 65%;"></div>
</div>
<!-- Checklist -->
<ul class="flex flex-col gap-sm mt-sm">
<li class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">图像清晰度</span>
</li>
<li class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">手相结构</span>
</li>
<li class="flex items-center gap-sm">
<!-- Loading State Icon -->
<span class="material-symbols-outlined text-secondary-container animate-pulse" style="font-variation-settings: 'FILL' 1;">hourglass_top</span>
<span class="font-body-md text-body-md text-on-surface font-medium">纹理分析...</span>
</li>
<li class="flex items-center gap-sm opacity-50">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface-variant">解读报告</span>
</li>
</ul>
</div>
</div>
<!-- Hint Text -->
<div class="mt-auto pt-lg w-full text-center">
<p class="font-label-sm text-label-sm text-outline-variant bg-surface-container rounded-full py-2 px-4 inline-block">
                你可以稍后在<span class="text-primary font-bold">生成记录</span>中查看进度
            </p>
</div>
