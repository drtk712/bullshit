<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>玩图局 - 弹窗组件集合</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#fdab1b",
                    "outline-variant": "#bbcabd",
                    "tertiary-fixed-dim": "#ffb4aa",

                    "inverse-surface": "#2a322c",
                    "on-error-container": "#93000a",
                    "outline": "#6c7b6f",
                    "inverse-on-surface": "#ebf3e9",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#65feaa",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#8c1813",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#42e090",
                    "secondary-fixed-dim": "#ffb953",
                    "on-error": "#ffffff",
                    "surface-container-high": "#e2eae1",
                    "background": "#f3fcf2",
                    "on-tertiary": "#ffffff",
                    "surface": "#f3fcf2",
                    "secondary": "#825500",
                    "surface-tint": "#006d40",
                    "on-secondary-fixed-variant": "#633f00",
                    "on-primary-fixed": "#002110",
                    "on-primary-fixed-variant": "#00522f",
                    "surface-container-highest": "#dce5db",
                    "on-secondary-container": "#694300",
                    "tertiary-container": "#ff8f81",
                    "primary-container": "#15c77a",
                    "tertiary": "#ad3128",
                    "secondary-fixed": "#ffddb4",
                    "tertiary-fixed": "#ffdad5",
                    "on-background": "#161d18",
                    "surface-variant": "#dce5db",
                    "on-surface": "#161d18",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#291800",
                    "on-secondary": "#ffffff",
                    "primary": "#006d40",
                    "surface-bright": "#f3fcf2",
                    "surface-container": "#e8f0e7",
                    "surface-dim": "#d4dcd3",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-page": "20px",
                    "xs": "4px",
                    "md": "16px",
                    "lg": "24px",
                    "gutter": "12px",
                    "sm": "8px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "h3": [
                            "Plus Jakarta Sans"
                    ],
                    "body-md": [
                            "Be Vietnam Pro"
                    ],
                    "h1": [
                            "Plus Jakarta Sans"
                    ],
                    "body-lg": [
                            "Be Vietnam Pro"
                    ],
                    "h2": [
                            "Plus Jakarta Sans"
                    ],
                    "label-sm": [
                            "Plus Jakarta Sans"
                    ]
            },
            "fontSize": {
                    "h3": [
                            "18px",
                            {
                                    "lineHeight": "26px",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "h1": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-lg": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "h2": [
                            "20px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ],
                    "label-sm": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.02em",
                                    "fontWeight": "500"

                    ]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-[20px] bg-surface/80 shadow-[0px_4px_20px_rgba(23,33,27,0.04)] flex justify-between items-center px-margin-page h-16 transition-colors">
<button class="text-on-surface-variant hover:bg-surface-container-high/50 active:scale-95 transition-all duration-200 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">grid_view</span>
</button>
<h1 class="font-h1 text-h1 tracking-tight text-on-surface">玩图局</h1>
<button class="text-on-surface-variant hover:bg-surface-container-high/50 active:scale-95 transition-all duration-200 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-24 pb-32 px-margin-page flex flex-col gap-lg">
<!-- Module: 赚积分列表模块 (Earn Points Module) -->
<section class="flex flex-col gap-md">
<div class="flex items-center justify-between">
<h2 class="font-h2 text-h2 text-on-surface">任务中心</h2>
<span class="font-label-sm text-label-sm text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">stars</span>
                    当前积分: 128
                </span>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<!-- Task Card: Check-in -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(23,33,27,0.04)] flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface">每日签到</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">+1 积分</p>
</div>
</div>
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full active:scale-95 transition-transform">
                        签到
                    </button>
</div>
<!-- Task Card: Share -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(23,33,27,0.04)] flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">share</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface">邀请好友</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">+5 积分</p>
</div>
</div>
<button class="bg-surface-container-high text-on-surface font-label-sm text-label-sm px-4 py-2 rounded-full active:scale-95 transition-transform">
                        去分享
                    </button>
</div>
</div>
</section>
<div class="w-full h-px bg-surface-container-highest my-sm"></div>
<!-- Component Gallery: Modals Displayed Inline for UI Presentation -->
<h2 class="font-h2 text-h2 text-on-surface mt-md">弹窗效果预览</h2>
<!-- Modal Showcase Wrapper 1: Check-in Success -->
<div class="relative w-full rounded-xl overflow-hidden bg-inverse-surface/10 flex items-center justify-center p-lg min-h-[400px]">
<!-- Check-in Success Modal -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(23,33,27,0.04)] w-[280px] overflow-hidden flex flex-col items-center animate-fade-in-up">
<!-- Illustration Image -->
<div class="w-full h-[180px] bg-surface-container relative">
<img alt="Success Illustration" class="w-full h-full object-cover" data-alt="A vibrant, modern 3D illustration of a floating, glowing golden coin or star emerging from a sleek, minimalist gift box. The scene is brightly lit with a soft, high-key light mode aesthetic, featuring a pastel green and white background. The style is playful yet polished, tactile, and designed to evoke a sense of digital reward and delight in a Gen-Z app interface." src="https://lh3.googleusercontent.com/aida/ADBb0uhSfR7Sy6yhtfMC0frrKdbeU4v3KtRBX7Qsd6dC6j-YekcQ_5WQyoCSajqLaGxNRye2gw7tVeGymQ2fuuTTbU1j8XsijDzZluPgPMIFwoJOyy1UKPRZqItd4_oplN2l280MCGNugrZcWyBxTWV0MU_41fEVgl5qvyr0nVgRn4ZqePO2e8tM7liLZuyqMmBw61vEkVXYU-spWpXaQcLyIXSqmWBeW0yox8m2yw28Mosk1URhrsd8dMG5hLSgk9l6UTKVj5eF0pL0RhU"/>
</div>
<!-- Content -->
<div class="p-lg flex flex-col items-center w-full text-center">
<h3 class="font-h1 text-h1 text-on-surface mb-xs">签到成功</h3>
<p class="font-h3 text-h3 text-secondary-container flex items-center gap-xs mb-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stars</span>
                        +1 积分
                    </p>
<button class="w-full bg-primary-container text-on-primary-container font-h3 text-h3 py-3 rounded-full active:scale-95 transition-transform">
                        开心收下
                    </button>
</div>
</div>
</div>
<!-- Modal Showcase Wrapper 2: Insufficient Points -->
<div class="relative w-full rounded-xl overflow-hidden bg-inverse-surface/10 flex items-center justify-center p-lg min-h-[300px]">
<!-- Insufficient Points Modal -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(23,33,27,0.04)] w-[300px] p-lg flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-error-container/50 flex items-center justify-center text-error mb-md">
<span class="material-symbols-outlined text-[32px]">error</span>
</div>
<h3 class="font-h2 text-h2 text-on-surface mb-sm">积分不足</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">完成签到或分享即可获得积分</p>
<div class="flex gap-sm w-full">
<button class="flex-1 bg-surface-container text-on-surface font-body-md text-body-md py-3 rounded-full active:scale-95 transition-transform">
                        取消
                    </button>
<button class="flex-1 bg-primary-container text-on-primary-container font-h3 text-h3 py-3 rounded-full active:scale-95 transition-transform shadow-[0px_4px_12px_rgba(21,199,122,0.2)]">
                        去赚积分
                    </button>
</div>
</div>
</div>
<!-- Modal Showcase Wrapper 3: Share to get points -->
<div class="relative w-full rounded-xl overflow-hidden bg-inverse-surface/10 flex items-center justify-center p-lg min-h-[300px]">
<!-- Share Modal -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(23,33,27,0.04)] w-[300px] p-lg flex flex-col items-center text-center relative">
<button class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary-container mb-md mt-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">ios_share</span>
</div>
<h3 class="font-h2 text-h2 text-on-surface mb-sm">分享得积分</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">邀请好友加入玩图局<br/>每次成功邀请可获得 <span class="text-secondary-container font-bold">5</span> 积分</p>
<button class="w-full bg-[#07C160] text-white font-h3 text-h3 py-3 rounded-full flex items-center justify-center gap-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">chat</span>
                    发送给微信好友
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-safe pt-2 bg-surface/80 backdrop-blur-[20px] shadow-[0px_-4px_20px_rgba(23,33,27,0.04)] z-50 rounded-t-xl transition-colors md:hidden">
<!-- Inactive: 首页 -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-150 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">home</span>
<span class="font-label-sm text-label-sm mt-1">首页</span>
</a>
<!-- Inactive: 生成记录 -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-150 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">history</span>
<span class="font-label-sm text-label-sm mt-1">生成记录</span>
</a>
<!-- Active: 我的 (Profile/Points center semantic match) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm mt-1">我的</span>
</a>
</nav>
<!-- Add safe area padding for modern mobile browsers -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</body></html>
