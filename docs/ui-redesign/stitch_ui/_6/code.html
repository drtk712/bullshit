<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>玩图局 - 任务详情</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#fdab1b",
                    "outline-variant": "#bbcabd",
                    "tertiary-fixed-dim": "#ffb4aa",
                    "primary-fixed-dim": "#42e090",
                    "on-tertiary-fixed": "#410001",
                    "surface-container-low": "#edf6ec",
                    "on-primary-container": "#004c2b",
                    "on-surface-variant": "#3c4a40",
                    "inverse-surface": "#2a322c",
                    "on-error-container": "#93000a",
                    "outline": "#6c7b6f",
                    "inverse-on-surface": "#ebf3e9",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#65feaa",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#8c1813",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#42e090",
                    "secondary-fixed-dim": "#ffb953",
                    "on-error": "#ffffff",
                    "surface-container-high": "#e2eae1",
                    "background": "#f3fcf2",
                    "on-tertiary": "#ffffff",
                    "surface": "#f3fcf2",
                    "secondary": "#825500",
                    "surface-tint": "#006d40",
                    "on-secondary-fixed-variant": "#633f00",
                    "on-primary-fixed": "#002110",
                    "on-primary-fixed-variant": "#00522f",
                    "surface-container-highest": "#dce5db",
                    "on-secondary-container": "#694300",
                    "tertiary-container": "#ff8f81",
                    "primary-container": "#15c77a",
                    "tertiary": "#ad3128",
                    "secondary-fixed": "#ffddb4",
                    "tertiary-fixed": "#ffdad5",
                    "on-background": "#161d18",
                    "surface-variant": "#dce5db",
                    "on-surface": "#161d18",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#291800",
                    "on-secondary": "#ffffff",
                    "primary": "#006d40",
                    "surface-bright": "#f3fcf2",
                    "surface-container": "#e8f0e7",
                    "surface-dim": "#d4dcd3",
                    "on-tertiary-container": "#84120f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-page": "20px",
                    "xs": "4px",
                    "md": "16px",
                    "lg": "24px",
                    "gutter": "12px",
                    "sm": "8px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "h3": ["Plus Jakarta Sans"],
                    "body-md": ["Be Vietnam Pro"],
                    "h1": ["Plus Jakarta Sans"],
                    "body-lg": ["Be Vietnam Pro"],
                    "h2": ["Plus Jakarta Sans"],
                    "label-sm": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "h3": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "h1": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-[20px] bg-surface/80 dark:bg-surface-dim/80 shadow-[0px_4px_20px_rgba(23,33,27,0.04)] px-margin-page h-16 flex justify-between items-center transition-colors">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 rounded-full active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<h1 class="font-h2 text-h2 text-on-surface">任务详情</h1>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 rounded-full active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-page py-lg space-y-lg flex flex-col">
<!-- Success Task Card -->
<section class="bg-surface-container-lowest rounded-[20px] p-md shadow-[0px_4px_20px_rgba(23,33,27,0.04)] flex flex-col space-y-md">
<!-- Header -->
<div class="flex justify-between items-center border-b border-surface-container/50 pb-sm">
<div class="flex items-center space-x-sm">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-[18px]">check_circle</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface">生成完成</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">2023-10-27 14:30</p>
</div>
</div>
<div class="bg-secondary-container/10 px-3 py-1 rounded-full flex items-center space-x-xs">
<span class="material-symbols-outlined text-secondary-container text-[14px]">stars</span>
<span class="font-label-sm text-label-sm text-secondary-container">-5 积分</span>
</div>
</div>
<!-- Preview Image -->
<div class="w-full aspect-[1.5] rounded-xl overflow-hidden relative group">
<img alt="Generated preview" class="w-full h-full object-cover" data-alt="A vibrant, highly detailed digital illustration of a futuristic cityscape bathed in warm, golden-hour sunlight. The scene features sleek, modern architecture with organic, flowing lines and lush greenery integrated into the structures. Soft, volumetric lighting highlights the metallic and glass surfaces, creating a sense of depth and realism. The overall aesthetic is optimistic, technically polished, and playful, perfectly matching the app's modern Gen-Z style." src="https://lh3.googleusercontent.com/aida/ADBb0uhSfR7Sy6yhtfMC0frrKdbeU4v3KtRBX7Qsd6dC6j-YekcQ_5WQyoCSajqLaGxNRye2gw7tVeGymQ2fuuTTbU1j8XsijDzZluPgPMIFwoJOyy1UKPRZqItd4_oplN2l280MCGNugrZcWyBxTWV0MU_41fEVgl5qvyr0nVgRn4ZqePO2e8tM7liLZuyqMmBw61vEkVXYU-spWpXaQcLyIXSqmWBeW0yox8m2yw28Mosk1URhrsd8dMG5hLSgk9l6UTKVj5eF0pL0RhU"/>
<div class="absolute inset-0 bg-black/10 group-hover:bg-black/20 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100">
<button class="bg-surface/90 text-on-surface font-label-sm text-label-sm px-4 py-2 rounded-full backdrop-blur-sm flex items-center space-x-xs hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[16px]">fullscreen</span>
<span>查看大图</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex space-x-sm pt-sm">
<button class="flex-1 bg-surface-container-high text-on-surface font-body-md text-body-md py-3 rounded-full hover:bg-surface-container-highest active:scale-[0.98] transition-all flex justify-center items-center space-x-sm">
<span class="material-symbols-outlined text-[20px]">share</span>
<span>分享</span>
</button>
<button class="flex-1 bg-primary-container text-on-primary font-body-md text-body-md py-3 rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center space-x-sm shadow-sm">
<span class="material-symbols-outlined text-[20px]">download</span>
<span>保存相册</span>
</button>
</div>
</section>
<!-- Failed Task Card Example (For UI demonstration) -->
<section class="bg-surface-container-lowest rounded-[20px] p-md shadow-[0px_4px_20px_rgba(23,33,27,0.04)] flex flex-col space-y-md border border-error/10">
<!-- Header -->
<div class="flex justify-between items-center border-b border-surface-container/50 pb-sm">
<div class="flex items-center space-x-sm">
<div class="w-8 h-8 rounded-full bg-error-container/50 flex items-center justify-center">
<span class="material-symbols-outlined text-error text-[18px]">error</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface">生成失败</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">2023-10-27 15:10</p>
</div>
</div>
<div class="bg-surface-container px-3 py-1 rounded-full flex items-center space-x-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">积分已退回</span>
</div>
</div>
<!-- Error Details -->
<div class="bg-error-container/20 rounded-xl p-md flex items-start space-x-sm">
<span class="material-symbols-outlined text-error mt-0.5">info</span>
<div>
<p class="font-body-md text-body-md text-on-surface font-medium">抱歉，处理您的图片时遇到问题。</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">原因：上传的图片主体不够清晰或光线过暗，导致AI无法准确识别。请尝试更换一张更清晰的照片。</p>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary font-body-md text-body-md py-3 rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center space-x-sm shadow-sm">
<span class="material-symbols-outlined text-[20px]">upload_file</span>
<span>重新上传</span>
</button>
</div>
</section>
</main>
<!-- Note: BottomNavBar is intentionally suppressed here as this is a transactional/task-focused sub-page with a back button. -->
</body></html>
