<!DOCTYPE html>

<body class="bg-background text-on-background min-h-screen pb-[100px] antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-[20px] bg-surface/80 dark:bg-surface-dim/80 shadow-[0px_4px_20px_rgba(23,33,27,0.04)]">
<div class="flex justify-between items-center w-full px-margin-page h-16 pt-safe">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-high/50 dark:hover:bg-surface-container-highest/50 transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
</button>
<h1 class="font-h1 text-h1 tracking-tight text-on-surface dark:text-on-surface-variant">玩图局</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-high/50 dark:hover:bg-surface-container-highest/50 transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
</header>
<main class="pt-[90px] px-margin-page flex flex-col gap-lg">
<!-- Welcome Section -->
<section class="flex flex-col gap-xs">
<h2 class="font-h2 text-h2 text-on-surface">Hi，玩图达人 👋</h2>
<p class="font-body-md text-body-md text-on-surface-variant">今天想玩点什么呢？</p>
</section>
<!-- Recommended Card -->
<section class="bg-surface-container-lowest rounded-[20px] shadow-[0px_4px_20px_rgba(23,33,27,0.04)] p-md flex flex-col gap-md relative overflow-hidden">
<div class="flex justify-between items-start z-10">
<div class="flex flex-col gap-sm w-3/5">
<h3 class="font-h3 text-h3 text-on-surface">看手相</h3>
<p class="font-body-md text-body-md text-on-surface-variant">上传清晰手掌照片，生成趣味手相解读海报</p>
<button class="mt-sm bg-primary-container text-on-primary font-label-sm text-label-sm py-2 px-4 rounded-[24px] self-start flex items-center gap-1 hover:opacity-90 active:scale-95 transition-all">
                        去玩一玩
                        <span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>

</div>
</section>
<!-- Categories -->

<button class="whitespace-nowrap font-label-sm text-label-sm flex items-center gap-1 border border-primary-container text-primary-container bg-primary-container/10 px-4 py-2 rounded-full shrink-0">
                🔥 热门
            </button>
<button class="whitespace-nowrap font-label-sm text-label-sm flex items-center gap-1 bg-surface-container text-on-surface-variant px-4 py-2 rounded-full shrink-0">
                🙂 人像
            </button>
<button class="whitespace-nowrap font-label-sm text-label-sm flex items-center gap-1 bg-surface-container text-on-surface-variant px-4 py-2 rounded-full shrink-0">
                🖼 风格化
            </button>
<button class="whitespace-nowrap font-label-sm text-label-sm flex items-center gap-1 bg-surface-container text-on-surface-variant px-4 py-2 rounded-full shrink-0">
                ✨ 趣味
            </button>
<button class="whitespace-nowrap font-label-sm text-label-sm flex items-center gap-1 bg-surface-container text-on-surface-variant px-4 py-2 rounded-full shrink-0">
                🧭 最新
            </button>
</section>
<!-- Grid Cards -->
<section class="grid grid-cols-2 gap-gutter">
<!-- Card 1 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-[0px_4px_20px_rgba(23,33,27,0.04)] overflow-hidden flex flex-col hover:shadow-md transition-shadow">
<div class="h-32 bg-surface-container-high w-full"></div>
<div class="p-3 flex flex-col gap-1">
<h4 class="font-label-sm text-label-sm font-bold text-on-surface">看手相</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 truncate">趣味解读命运密码</p>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-[0px_4px_20px_rgba(23,33,27,0.04)] overflow-hidden flex flex-col hover:shadow-md transition-shadow">

<div class="p-3 flex flex-col gap-1">
<h4 class="font-label-sm text-label-sm font-bold text-on-surface">设计发型</h4>

</div>

<p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 truncate">测测你的气质类型</p>
</div>
</div>

<p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 truncate">一键生成韩系手绘</p>
</div>
</div>

<div class="h-24 bg-surface-container-high w-full"></div>
<div class="p-3 flex flex-col gap-1">
<h4 class="font-label-sm text-label-sm font-bold text-on-surface">灵魂画手</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 truncate">草图变大师画作</p>
</div>
</div>
</section>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-safe pt-2 bg-surface/80 backdrop-blur-[20px] shadow-[0px_-4px_20px_rgba(23,33,27,0.04)] z-50 rounded-t-xl">
<!-- Active Tab: 首页 -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed-dim text-on-primary-container dark:text-on-primary-fixed rounded-full px-5 py-1.5 hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">首页</span>
</button>
<!-- Inactive Tab: 生成记录 -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1.5 hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-sm text-label-sm mt-1">生成记录</span>
